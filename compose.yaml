services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: leaveassistant
      POSTGRES_USER: leaveassistant
      POSTGRES_PASSWORD: leaveassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveassistant -d leaveassistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
